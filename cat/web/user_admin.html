<!DOCTYPE html>
<html>
<head>
  <title>CAT: User Management</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1.0">
  <link rel="stylesheet" href="css/cat-theme.css" />
  <style>
    body { margin: 0; padding: 0; font-family: var(--cat-font);
      background: var(--cat-surface-alt); color: var(--cat-ink); }
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 24px; margin-bottom: var(--cat-space-4); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--cat-border); font-size: 14px; }
    th { font-weight: 700; color: var(--cat-ink-muted, #555); }
    select { padding: 6px 8px; border-radius: var(--cat-radius); border: 1px solid var(--cat-border); }
    .inline-edit { width: 100px; padding: 5px 6px; border-radius: var(--cat-radius); border: 1px solid var(--cat-border); font-size: 13px; }
    .inline-edit.initials { width: 60px; }
    .row-actions { display: flex; gap: var(--cat-space-2); align-items: center; flex-wrap: wrap; }
    .status-msg { font-size: 13px; margin-top: var(--cat-space-2); min-height: 18px; }
    .status-msg.error { color: var(--cat-error); }
    .status-msg.ok { color: var(--cat-success, green); }
    .inactive-row { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="container">
    <div class="cat-card">
      <h1>User Management</h1>
      <div class="table-scroll">
      <table id="usersTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Initials</th>
            <th>Display Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Active</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <script src="js/cat-nav.js"></script>
  <script src="js/cat-auth.js"></script>
  <script>
    var tbody = document.getElementById('usersBody');
    var statusMsg = document.getElementById('statusMsg');

    function showStatus(text, isError) {
      statusMsg.textContent = text;
      statusMsg.className = 'status-msg ' + (isError ? 'error' : 'ok');
    }

    function loadUsers() {
      fetch('/api/auth/admin/users', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (data) { renderUsers(data.users || []); })
        .catch(function () { showStatus('Failed to load users', true); });
    }

    function renderUsers(users) {
      tbody.innerHTML = '';
      users.forEach(function (u) {
        var tr = document.createElement('tr');
        if (!u.is_active) tr.classList.add('inactive-row');

        var roleSelect = document.createElement('select');
        ['annotator', 'admin'].forEach(function (r) {
          var opt = document.createElement('option');
          opt.value = r; opt.textContent = r;
          if (r === u.role) opt.selected = true;
          roleSelect.appendChild(opt);
        });
        roleSelect.addEventListener('change', function () {
          updateUser(u.user_id, { role: roleSelect.value });
        });

        var activeBtn = document.createElement('button');
        activeBtn.className = 'cat-btn cat-btn--outline';
        activeBtn.textContent = u.is_active ? 'Deactivate' : 'Activate';
        activeBtn.addEventListener('click', function () {
          updateUser(u.user_id, { is_active: !u.is_active });
        });

        var resetBtn = document.createElement('button');
        resetBtn.className = 'cat-btn cat-btn--outline';
        resetBtn.textContent = 'Reset Password';
        resetBtn.addEventListener('click', function () {
          var newPassword = window.prompt('New password for ' + u.username + ' (min 8 chars):');
          if (!newPassword) return;
          fetch('/api/auth/admin/users/' + u.user_id + '/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ new_password: newPassword })
          }).then(function (r) {
            if (!r.ok) { showStatus('Failed to reset password', true); return; }
            showStatus('Password reset for ' + u.username, false);
          });
        });

        var actionsTd = document.createElement('td');
        var actionsWrap = document.createElement('div');
        actionsWrap.className = 'row-actions';
        actionsWrap.appendChild(activeBtn);
        actionsWrap.appendChild(resetBtn);
        actionsTd.appendChild(actionsWrap);

        var usernameTd = document.createElement('td');
        usernameTd.textContent = u.username;
        tr.appendChild(usernameTd);

        function makeInlineEdit(field, value, extraClass) {
          var td = document.createElement('td');
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'inline-edit' + (extraClass ? ' ' + extraClass : '');
          input.value = value || '';
          input.addEventListener('change', function () {
            var payload = {};
            payload[field] = input.value || null;
            updateUser(u.user_id, payload);
          });
          td.appendChild(input);
          return td;
        }

        tr.appendChild(makeInlineEdit('first_name', u.first_name));
        tr.appendChild(makeInlineEdit('last_name', u.last_name));
        tr.appendChild(makeInlineEdit('initials', u.initials, 'initials'));
        tr.appendChild(makeInlineEdit('display_name', u.display_name));

        var emailTd = document.createElement('td');
        emailTd.textContent = u.email;
        tr.appendChild(emailTd);

        var roleTd = document.createElement('td');
        roleTd.appendChild(roleSelect);
        tr.appendChild(roleTd);

        var activeTd = document.createElement('td');
        activeTd.textContent = u.is_active ? 'Yes' : 'No';
        tr.appendChild(activeTd);

        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      });
    }

    function updateUser(userId, payload) {
      fetch('/api/auth/admin/users/' + userId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) { showStatus('Update failed', true); return; }
        showStatus('Updated', false);
        loadUsers();
      });
    }

    CatAuth.requireAdmin().then(function (user) {
      if (user) loadUsers();
    });
  </script>
</body>
</html>
