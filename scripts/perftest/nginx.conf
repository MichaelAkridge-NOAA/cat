# Test-only reverse proxy that behaves like the Cloud Workstations gateway
# toward CAT: it keeps upstream connections open and reuses them after idle
# gaps (Google's front ends keep them for up to ~10 minutes). If uvicorn
# closes an idle connection first (its default keep-alive is 5 s), a request
# sent on it at that moment fails. nginx retries idempotent GETs on another
# connection but not PUT/POST, which then return 502 -- the same way a save
# would fail behind the real gateway.
# Used by docker-compose.proxytest.yml; not part of a normal deployment.

events {}

http {
    # rt = total time nginx spent on the request; uct/urt = time to connect
    # to / get the full answer from cat-app. rt much larger than urt means the
    # delay is in the proxy hop, not in CAT.
    log_format timed '$remote_addr "$request" $status rt=$request_time '
                     'uct=$upstream_connect_time urt=$upstream_response_time conn=$connection reqs=$connection_requests';
    access_log /dev/stdout timed;
    error_log /dev/stderr warn;

    upstream cat_app {
        server cat-app:8000;
        keepalive 32;
        keepalive_timeout 600s;
        keepalive_requests 100000;
    }

    server {
        listen 8080;
        client_max_body_size 200m;

        location / {
            proxy_pass http://cat_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
